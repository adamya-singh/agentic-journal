<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant: the same dawn, with the sun a little smaller so it stays inside the 80% safe circle. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset=".42" stop-color="#1b3f6e"/>
      <stop offset=".62" stop-color="#5b7aa6"/>
      <stop offset=".72" stop-color="#c9a08a"/>
      <stop offset=".78" stop-color="#e39a5f"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="388" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc26b" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#ff9a3c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="256" cy="370" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".34" stop-color="#fff6d8"/>
      <stop offset=".58" stop-color="#ffd27a"/>
      <stop offset=".82" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff7a2f"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2440"/>
      <stop offset="1" stop-color="#070d1c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="92" cy="96" r="3" opacity=".9"/>
    <circle cx="168" cy="58" r="2" opacity=".7"/>
    <circle cx="352" cy="84" r="2.6" opacity=".8"/>
    <circle cx="430" cy="140" r="2" opacity=".65"/>
    <circle cx="250" cy="122" r="1.8" opacity=".6"/>
    <circle cx="60" cy="190" r="1.6" opacity=".5"/>
  </g>
  <rect width="512" height="512" fill="url(#glow)"/>
  <circle cx="256" cy="388" r="100" fill="url(#sun)"/>
  <rect y="388" width="512" height="124" fill="url(#ground)"/>
  <rect y="386" width="512" height="4" fill="#ffd27a" opacity=".85"/>
  <g fill="#ffb25c">
    <rect x="176" y="410" width="160" height="5" rx="2.5" opacity=".55"/>
    <rect x="206" y="430" width="100" height="4" rx="2" opacity=".35"/>
    <rect x="232" y="448" width="48" height="3" rx="1.5" opacity=".2"/>
  </g>
</svg>
